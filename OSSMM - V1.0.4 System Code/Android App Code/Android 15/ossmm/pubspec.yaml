name: ossmm
description: A Flutter project for OSSMM.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.7.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # Foreground service + wake lock
  flutter_foreground_task: ^9.1.0
  wakelock_plus: ^1.3.2

  # BLE
  flutter_blue_plus: ^1.35.0

  # App state & utilities
  provider: ^6.1.2
  permission_handler: ^12.0.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  intl: ^0.20.2

  # Storage / crypto you were using
  archive: ^4.0.7
  flutter_secure_storage: ^8.0.0
  encrypt: ^5.0.1
  crypto: ^3.0.3

  # Required by your location_service.dart
  location: ^7.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
